[package]
name = "deadcat-rfq-iroh"
description = "Bounded authenticated Iroh transport for the Deadcat RFQ protocol."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
deadcat-iroh.workspace = true
deadcat-rfq-rpc.workspace = true
iroh.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "rt", "sync", "time"] }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio.workspace = true

[dev-dependencies]
deadcat-types.workspace = true
elements.workspace = true
tokio = { workspace = true, features = ["test-util"] }
